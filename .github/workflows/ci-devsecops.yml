# SHORTURL DevSecOps CI — required checks（名稱勿改）:
#   secrets-gitleaks / sast-gosec / sca-govulncheck / unit-test
# 門檻：docs/06-security/03-ci-security-gates-v0.3.md（不得放寬）
# 設計：docs/09-cicd-env/01-ci-pipeline-v0.2.md
# 第三方 uses 皆釘完整 40 字元 commit SHA，版本見行尾註解（SCR-004）
# 工具鏈釘 Go 1.27.3（CR-006 由 CR-002 的 1.27.2 升修補版，修 GO-2026-6809；check-latest: false）。1.22 標準庫有 GO-2025-3750；1.24.13 是 1.24 最後一版，
# 現行 vuln DB 仍回報可達的標準庫問題，且修補只在受支援版本。鎖定的
# govulncheck@v1.1.3／gosec@v2.21.4 在 Go 1.25+ 無法編譯；gosec 依 CR-005 換回發行版 v2.30.0（取代 CR-002 暫行釘的 707f227）並驗 h1，故改為仍會擋 High/Critical
# 的可編譯版本。job 名稱與阻擋門檻不變。

name: ci-devsecops

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-gitleaks:
    name: secrets-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          TGZ="gitleaks_${VER}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          # SCR-021：釘官方 checksums 檔中 linux_x64 的 sha256，並與同 release 的 checksums 檔交叉比對
          EXPECTED_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          cd "$(mktemp -d)"
          curl -fsSL -o "${TGZ}" "${BASE}/${TGZ}"
          curl -fsSL -o checksums.txt "${BASE}/gitleaks_${VER}_checksums.txt"
          official="$(awk -v f="${TGZ}" '$2==f {print $1}' checksums.txt)"
          if [ "${official}" != "${EXPECTED_SHA256}" ]; then echo "::error::checksums.txt 與釘選值不符：${official}"; exit 1; fi
          echo "${EXPECTED_SHA256}  ${TGZ}" | sha256sum -c -
          tar -xzf "${TGZ}" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --exit-code 1

  sast-gosec:
    name: sast-gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.3"
          check-latest: false
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - name: Verify gosec module hash (CR-002)
        run: |
          set -euo pipefail
          expected='h1:67aF6LHa7SAL6QEc4es857GrXTT50gUqmrl0XPhtDx0='
          bin="$(go env GOPATH)/bin/gosec"
          line="$(go version -m "$bin" | awk '$1=="mod" && $2=="github.com/securego/gosec/v2"')" || true
          if [ -z "$line" ]; then echo "::error::mod github.com/securego/gosec/v2 line missing"; exit 1; fi
          echo "$line"
          actual="$(echo "$line" | awk '{print $4}')"
          if [ "$actual" != "$expected" ]; then echo "::error::gosec h1 mismatch: $actual != $expected"; exit 1; fi
          echo "gosec h1 OK"
      - name: Run gosec (block HIGH/CRITICAL)
        run: |
          set -euo pipefail
          # -severity=high：僅 high/critical 導致非零；對齊 SEC-009
          # -tests：測試檔一併掃描（SCR-032）；以絕對路徑呼叫，不依賴 PATH（SCR-019）
          "$(go env GOPATH)/bin/gosec" -fmt=text -no-fail=false -severity=high -tests ./...

  sca-govulncheck:
    name: sca-govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.3"
          check-latest: false
      - name: Ensure go.sum present
        run: test -f go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Run govulncheck
        # Critical 擋；High 有修補亦應擋（見 01-ci-pipeline §3.3）
        run: govulncheck ./...
      # Dependency graph 已開啟（CR-001 裁示）：compare API 非 200 即失敗（fail-closed）。
      # SHA 與 repository 經 env 傳入，避免在 run 內插值 github context。
      # Dependency review 於每個 pull_request 執行，Critical 仍擋。
      - name: Probe dependency graph
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dep-review.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")
          echo "dependency graph compare HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Dependency graph compare API returned HTTP ${code}; dependency-review is fail-closed (CR-001 ruling)."
            exit 1
          fi
      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4 (v4.9.0)
        with:
          fail-on-severity: critical

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.3"
          check-latest: false
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test (-race, JSON)
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go test -race -json ./... | tee go-test.json > /dev/null
      - name: ENG-011 per-source isolation test must PASS (no SKIP)
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run '^TestENG011_PerSourceIsolationByPeerAddress$' ./internal/integration/ | tee eng011.log
          if ! grep -q -- '--- PASS: TestENG011_PerSourceIsolationByPeerAddress' eng011.log; then
            echo "::error::TestENG011_PerSourceIsolationByPeerAddress 未執行或被 SKIP"; exit 1
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-test-json
          path: go-test.json
          retention-days: 14
          if-no-files-found: warn
