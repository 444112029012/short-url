# SHORTURL DevSecOps CI — required checks（名稱勿改）:
#   secrets-gitleaks / sast-gosec / sca-govulncheck / unit-test
# 門檻：docs/06-security/03-ci-security-gates-v0.3.md（不得放寬）
# 設計：docs/09-cicd-env/01-ci-pipeline-v0.1.md
# 注意：uses 請於穩定後改釘完整 commit SHA
# 工具鏈用 1.27.x（目前支援線）。1.22 標準庫有 GO-2025-3750；1.24.13 是 1.24 最後一版，
# 現行 vuln DB 仍回報可達的標準庫問題，且修補只在受支援版本。鎖定的
# govulncheck@v1.1.3／gosec@v2.21.4 在 Go 1.25+ 無法編譯，故改為仍會擋 High/Critical
# 的可編譯版本。job 名稱與阻擋門檻不變。

name: ci-devsecops

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-gitleaks:
    name: secrets-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --exit-code 1

  sast-gosec:
    name: sast-gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: Run gosec (block HIGH/CRITICAL)
        run: |
          set -euo pipefail
          # -severity=high：僅 high/critical 導致非零；對齊 SEC-009
          gosec -fmt=text -no-fail=false -severity=high ./...

  sca-govulncheck:
    name: sca-govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Ensure go.sum present
        run: test -f go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Run govulncheck
        # Critical 擋；High 有修補亦應擋（見 01-ci-pipeline §3.3）
        run: govulncheck ./...
      # Dependency graph 已開啟（CR-001 裁示）：compare API 非 200 即失敗（fail-closed）。
      # SHA 與 repository 經 env 傳入，避免在 run 內插值 github context。
      # 200 時仍記 enabled=true；Dependency review 於每個 pull_request 執行，Critical 仍擋。
      - name: Probe dependency graph
        id: depgraph
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dep-review.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")
          echo "dependency graph compare HTTP ${code}"
          if [ "${code}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Dependency graph compare API returned HTTP ${code}; dependency-review is fail-closed (CR-001 ruling)."
            exit 1
          fi
      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
